      gl.useProgram(p.program);
      bindAttributes(gl, p, mesh);
      gl.uniformMatrix4fv(p.uniforms.uProjection, false, opts.projection);
      gl.uniformMatrix4fv(p.uniforms.uView, false, opts.view);
      gl.uniformMatrix4fv(p.uniforms.uModel, false, opts.model || identityM);
      gl.uniform1f(p.uniforms.uScale, opts.scale != null ? opts.scale : 400);
      gl.uniform1f(p.uniforms.uOpacity, opts.opacity != null ? opts.opacity : 1);
      issueDraw(gl, mesh);
    },

    dispose() {
      for (const p of Object.values(programs)) gl.deleteProgram(p.program);
    },
  };

  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); api.lost = true; });
  canvas.addEventListener('webglcontextrestored', () => { api.lost = false; });
  return api;
}

function bindAttributes(gl, program, mesh) {
  program.attributes.forEach((name, i) => {
    const b = mesh.buffers[name];
    if (!b) { gl.disableVertexAttribArray(i); return; }
    gl.bindBuffer(gl.ARRAY_BUFFER, b.buffer);
    gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(i, b.size, gl.FLOAT, false, 0, 0);
  });
  if (mesh.index) gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.index);
}

function issueDraw(gl, mesh) {
  if (mesh.index) gl.drawElements(mesh.mode, mesh.count, mesh.indexType, 0);
  else gl.drawArrays(mesh.mode, 0, mesh.count);
}

/** Multiply projection and view once per frame for screen-space projection. */
function viewProjection(projection, view, out = new Float32Array(16)) {
  return multiply(projection, view, out);
}



Object.assign(__exports, {createRenderer, viewProjection});
});

__def("ui/controls", function (__exports, __req) {
/**
 * Toolbar control factories.
 *
 * Each returns { node, set(value) } so the toolbar can rebuild cheaply and still
 * push state changes back into controls the user is not currently touching.
 */
const { el, icon } = __req("ui/dom");

let uid = 0;
const nextId = (prefix) => `epwviz-${prefix}-${(uid += 1)}`;

/** A labelled group of controls. */
function group(label, ...children) {
  return el('div.group', {}, el('div.group-label', { text: label }), el('div.group-body', {}, ...children));
}

/** A native select, which is the right control on a phone as well as a desktop. */
function select(options, value, onChange, opts = {}) {
  const id = nextId('sel');
  const node = el('select.select', { id, 'aria-label': opts.ariaLabel || opts.label || 'option' });
  const render = (v) => {
    node.replaceChildren();
    for (const o of options) {
      if (o.group) {
        const g = el('optgroup', { label: o.group });
        for (const child of o.options) {
          g.appendChild(el('option', { value: child.value, selected: child.value === v }, child.label));
        }
        node.appendChild(g);
      } else {
        node.appendChild(el('option', { value: o.value, selected: o.value === v }, o.label));
      }
    }
  };
  render(value);
  node.addEventListener('change', () => onChange(node.value));
  const wrap = opts.label
    ? el('label.field', {}, el('span.field-label', { text: opts.label }), node)
    : node;
  return { node: wrap, input: node, set: (v) => { node.value = v; }, setOptions: (o, v) => { options = o; render(v); } };
}

/** A range input with a live value readout. */
function slider(opts) {
  const out = el('span.slider-value', { text: opts.format ? opts.format(opts.value) : String(opts.value) });
  const input = el('input.slider', {
    type: 'range',
    min: String(opts.min),
    max: String(opts.max),
    step: String(opts.step || 1),
    value: String(opts.value),
    'aria-label': opts.label,
  });
  const emit = (commit) => {
    const v = Number(input.value);
    out.textContent = opts.format ? opts.format(v) : String(v);
    opts.onInput?.(v, commit);
  };
  input.addEventListener('input', () => emit(false));
  input.addEventListener('change', () => emit(true));
  const node = el('label.field', {},
    el('span.field-label', {}, opts.label, out),
    input);
  return {
    node,
    input,
    set(v) {
      input.value = String(v);
      out.textContent = opts.format ? opts.format(v) : String(v);
    },
  };
}

/** A segmented control — the right shape for 2 to 5 mutually exclusive options. */
function segmented(options, value, onChange, opts = {}) {
  const buttons = new Map();
  const node = el('div.segmented', { role: 'radiogroup', 'aria-label': opts.label || '' });
  for (const o of options) {
    const b = el('button.seg', {
      type: 'button',
      role: 'radio',
      'aria-checked': o.value === value ? 'true' : 'false',
      title: o.title || o.label,
      onclick: () => onChange(o.value),
    }, o.icon ? icon(o.icon, 15) : null, o.label ? el('span', { text: o.label }) : null);
    if (o.value === value) b.classList.add('is-active');
    buttons.set(o.value, b);
    node.appendChild(b);
  }
  const wrap = opts.label && opts.showLabel !== false
    ? el('label.field', {}, el('span.field-label', { text: opts.label }), node)
    : node;
  return {
    node: wrap,
    set(v) {
      for (const [key, b] of buttons) {
        const on = key === v;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      }
    },
  };
}

/** A checkbox styled as a switch. */
function toggle(label, value, onChange, opts = {}) {
  const input = el('input', { type: 'checkbox', checked: value, 'aria-label': label });
  input.addEventListener('change', () => onChange(input.checked));
  const node = el('label.toggle', { title: opts.title || '' },
    input, el('span.toggle-track', {}, el('span.toggle-thumb')), el('span.toggle-label', { text: label }));
  return { node, input, set: (v) => { input.checked = !!v; } };
}

/** A plain button, optionally icon-only. */
function button(label, onClick, opts = {}) {
  const node = el('button.btn', {
    type: 'button',
    title: opts.title || label,
    'aria-label': opts.ariaLabel || label,
    onclick: onClick,
  }, opts.icon ? icon(opts.icon, opts.iconSize || 15) : null,
  opts.iconOnly ? null : el('span', { text: label }));
  if (opts.variant) node.classList.add(`epwviz-btn-${opts.variant}`);
  if (opts.iconOnly) node.classList.add('epwviz-btn-icon');
  return {
    node,
    setLabel(text) { const s = node.querySelector('span'); if (s) s.textContent = text; },
    setActive(on) { node.classList.toggle('is-active', !!on); },
    setDisabled(on) { node.disabled = !!on; },
  };
}

/**
 * A month/day picker built from two selects — more reliable inside a WordPress
 * page than <input type="date">, whose native picker some themes restyle badly.
 */
function dayPicker(label, value, onChange, daysInMonth) {
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const monthSel = el('select.select.select-compact', { 'aria-label': `${label} month` });
  MONTHS.forEach((m, i) => monthSel.appendChild(el('option', { value: String(i + 1) }, m)));
  const daySel = el('select.select.select-compact', { 'aria-label': `${label} day` });

  function fillDays(month, day) {
    daySel.replaceChildren();
    const n = daysInMonth(month);
    for (let d = 1; d <= n; d += 1) daySel.appendChild(el('option', { value: String(d) }, String(d)));
    daySel.value = String(Math.min(day, n));
  }

  monthSel.value = String(value.month);
  fillDays(value.month, value.day);

  const emit = () => {
    const month = Number(monthSel.value);
    fillDays(month, Number(daySel.value));
    onChange({ month, day: Number(daySel.value) });
  };
  monthSel.addEventListener('change', emit);
  daySel.addEventListener('change', emit);

  return {
    node: el('label.field', {},
      el('span.field-label', { text: label }),
      el('div.daypicker', {}, daySel, monthSel)),
    set(v) {
      monthSel.value = String(v.month);
      fillDays(v.month, v.day);
    },
  };
}



Object.assign(__exports, {group, select, slider, segmented, toggle, button, dayPicker, nextId});
});

__def("ui/dom", function (__exports, __req) {
/**
 * Minimal DOM helpers.
 *
 * There is deliberately no raw-HTML escape hatch: text out of an EPW file
 * (city names, header comments) reaches the UI, and all of it goes through
 * textContent so a crafted file cannot inject markup.
 *
 * Everything the app creates lives under one root element and carries an
 * `epwviz-` class prefix, so a WordPress theme's stylesheet cannot reach in and
 * a plugin's script cannot collide with anything here.
 */

const NS = 'epwviz';

/** el('div.foo#bar', { attrs }, ...children) */
function el(spec, props, ...children) {
  const [tagPart, ...rest] = String(spec).split(/(?=[.#])/);
  const node = document.createElement(tagPart || 'div');
  for (const token of rest) {
    if (token.startsWith('.')) node.classList.add(`${NS}-${token.slice(1)}`);
    else if (token.startsWith('#')) node.id = token.slice(1);
  }
  if (props) {
    for (const [key, value] of Object.entries(props)) {
      if (value == null || value === false) continue;
      if (key === 'text') node.textContent = value;
      else if (key === 'style' && typeof value === 'object') Object.assign(node.style, value);
      else if (key.startsWith('on') && typeof value === 'function') {
        node.addEventListener(key.slice(2).toLowerCase(), value);
      } else if (key === 'class') node.className = value;
      else node.setAttribute(key, value === true ? '' : String(value));
    }
  }
  append(node, children);
  return node;
}

function append(node, children) {
  for (const child of children.flat(4)) {
    if (child == null || child === false) continue;
    node.appendChild(typeof child === 'string' || typeof child === 'number'
      ? document.createTextNode(String(child))
      : child);
  }
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

/** An inline SVG icon from a path, sized to the current font. */
function icon(path, size = 16) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.8');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', path);
  svg.appendChild(p);
  return svg;
}

const ICONS = {
  upload: 'M12 16V4m0 0L7 9m5-5 5 5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2',
  play: 'M7 4v16l13-8z',
  pause: 'M8 4v16M16 4v16',
  sun: 'M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M3 12h2m14 0h2M5.6 18.4 7 17m10-10 1.4-1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
  moon: 'M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z',
  printer: 'M6 9V3h12v6M6 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1M6 14h12v7H6z',
  expand: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  collapse: 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5',
  download: 'M12 4v12m0 0-5-5m5 5 5-5M4 18v2h16v-2',
  columns: 'M4 4h7v16H4zM13 4h7v16h-7z',
  menu: 'M4 7h16M4 12h16M4 17h16',
  close: 'M6 6l12 12M18 6L6 18',
  reset: 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5',
  info: 'M12 16v-5m0-3h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',
};



Object.assign(__exports, {el, clear, icon, ICONS, NS});
});

__def("ui/export", function (__exports, __req) {
/**
 * Export: a PNG of whatever is on screen, and a CSV of the aggregated data
 * behind it. Students need both — one for the crit wall, one for a spreadsheet.
 */
const { MONTH_ABBR, locationLabel } = __req("epw/parse");
const { monthlyStats, diurnalByMonth, dailyAggregate, windRose } = __req("core/stats");
const { unitFor, convert } = __req("epw/fields");
const { describePeriod } = __req("core/filter");

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function safeName(text) {
  return String(text).replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() || 'export';
}

/**
 * Compose the visible view into a PNG at 2x, with a caption bar so the image
 * still says which climate and which period it came from once it leaves the app.
 */
function exportPng(stage, context, state) {
  const source = stage.is3d ? stage.scene?.canvas : stage.canvas;
  if (!source) return;
  const overlay = stage.is3d ? stage.scene?.overlay : null;

  const scale = 2;
  const w = source.width;
  const h = source.height;
  const captionH = Math.round(52 * (w / 1200 || 1) * 0.9) + 24;

  const out = document.createElement('canvas');
  out.width = w;
  out.height = h + captionH;
  const ctx = out.getContext('2d');

  const styles = getComputedStyle(stage.surface);
  ctx.fillStyle = styles.getPropertyValue('--surface-1').trim() || '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(source, 0, 0);
  if (overlay) ctx.drawImage(overlay, 0, 0, w, h);

  const ink1 = styles.getPropertyValue('--ink-1').trim() || '#111';
  const ink3 = styles.getPropertyValue('--ink-3').trim() || '#888';
  const font = 'system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  const base = Math.max(11, Math.round(w / 90));
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = ink1;
  ctx.font = `600 ${base}px ${font}`;
  const title = context ? `${context.field.label} — ${locationLabel(context.data.location)}` : 'EPW climate data';
  ctx.fillText(title, 24, h + base + 14);
  ctx.fillStyle = ink3;
  ctx.font = `400 ${Math.round(base * 0.82)}px ${font}`;
  const sub = context
    ? `${describePeriod(context.period, context.data.isLeap)} · ${state.fileName || 'EPW file'}`
    : '';
  ctx.fillText(sub, 24, h + base * 2 + 16);

  out.toBlob((blob) => {
    if (blob) download(blob, `${safeName(context ? locationLabel(context.data.location) : 'climate')}-${stage.activeId}.png`);
  }, 'image/png');
}

function toCsv(rows) {
  return rows.map((row) => row.map((cell) => {
    const text = cell == null || (typeof cell === 'number' && !Number.isFinite(cell)) ? '' : String(cell);
    return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
  }).join(',')).join('\n');
}

/** CSV matched to the active view, so what is exported is what is on screen. */
function exportCsv(viewId, context, state) {
  if (!context) return;
  const { data, field, values, mask } = context;
  const u = state.units;
  const unit = unitFor(field, u);
  const conv = (v) => (Number.isFinite(v) ? +convert(field, v, u).toFixed(4) : '');
  const header = [
    `# EPW climate data export — ${locationLabel(data.location)}`,
    `# ${data.location.latitude}, ${data.location.longitude}, elevation ${data.location.elevation} m`,
    `# Variable: ${field.label} (${unit})`,
    `# Period: ${describePeriod(context.period, data.isLeap)}`,
    `# Source file: ${state.fileName || 'unknown'}`,
  ].join('\n');

  let rows;
  let suffix;
  if (viewId === 'monthly') {
    const st = monthlyStats(data, values, mask);
    rows = [['month', `mean (${unit})`, `median (${unit})`, `p5 (${unit})`, `p25 (${unit})`,
      `p75 (${unit})`, `p95 (${unit})`, `min (${unit})`, `max (${unit})`, 'hours']];
    st.forEach((s, m) => rows.push([MONTH_ABBR[m], conv(s.mean), conv(s.p[50]), conv(s.p[5]),
      conv(s.p[25]), conv(s.p[75]), conv(s.p[95]), conv(s.min), conv(s.max), s.count || 0]));
    suffix = 'monthly';
  } else if (viewId === 'diurnal') {
    const grid = diurnalByMonth(data, values, mask);
    rows = [['hour', ...MONTH_ABBR.map((m) => `${m} (${unit})`)]];
    for (let h = 0; h < 24; h += 1) {
      rows.push([h, ...Array.from({ length: 12 }, (_, m) => conv(grid[m * 24 + h]))]);
    }
    suffix = 'diurnal';
  } else if (viewId === 'windrose' || viewId === 'windrose3d') {
    const rose = windRose(data, mask, { sectors: state.stats.sectors || 16 });
    rows = [['direction', ...rose.speedBands.map((b, i) => {
      const hi = rose.speedBands[i + 1];
      return hi == null ? `>= ${b} m/s (hours)` : `${b}-${hi} m/s (hours)`;
    }), 'total hours', 'share %']];
    for (let s = 0; s < rose.sectors; s += 1) {
      rows.push([rose.labels[s],
        ...Array.from({ length: rose.bandCount }, (_, b) => rose.counts[s * rose.bandCount + b]),
        rose.sectorTotals[s],
        +((rose.sectorTotals[s] / rose.total) * 100).toFixed(3)]);
    }
    rows.push(['Calm', ...Array(rose.bandCount).fill(''), rose.calm, +((rose.calmFraction) * 100).toFixed(3)]);
    suffix = 'windrose';
  } else if (viewId === 'timeseries') {
    const daily = dailyAggregate(data, values, 'mean', null);
    rows = [['month', 'day', `mean (${unit})`, `min (${unit})`, `max (${unit})`, 'hours', 'in period']];
    for (let d = 0; d < data.nDays; d += 1) {
      const key = data.dayKeys[d];
      let inPeriod = 0;
      for (let hh = 0; hh < 24; hh += 1) {
        const rec = data.grid[d * 24 + hh];
        if (rec >= 0 && mask[rec]) inPeriod += 1;
      }
      rows.push([key.month, key.day, conv(daily.values[d]), conv(daily.min[d]), conv(daily.max[d]),
        daily.counts[d], inPeriod]);
    }
    suffix = 'daily';
  } else {
    // Every other view is ultimately reading the hourly record, so export that.
    rows = [['month', 'day', 'hour', `${field.key} (${unit})`, 'in period']];
    for (let i = 0; i < data.n; i += 1) {
      rows.push([data.month[i], data.day[i], data.hour[i], conv(values[i]), mask[i] ? 1 : 0]);
    }
    suffix = 'hourly';
  }

  const csv = `${header}\n${toCsv(rows)}\n`;
  download(new Blob([csv], { type: 'text/csv;charset=utf-8' }),
    `${safeName(locationLabel(data.location))}-${safeName(field.key)}-${suffix}.csv`);
}



Object.assign(__exports, {exportPng, exportCsv, download, safeName});
});

__def("ui/modes", function (__exports, __req) {
/**
 * Analysis modes and the view registry.
 *
 * A mode is a teaching workflow: it decides which views are on the shelf, which
 * variable they open on, and which toolbar controls are relevant. Switching mode
 * reconfigures the whole instrument in one move, so a tutor can step a class
 * through a structured climate study without hunting through menus.
 */

const VIEWS = [
  { id: 'heatmap', label: 'Annual heatmap', kind: '2d', hint: 'Every hour of the year as one picture' },
  { id: 'timeseries', label: 'Time series', kind: '2d', hint: 'Daily range and mean through the year' },
  { id: 'diurnal', label: 'Daily profiles', kind: '2d', hint: 'Average 24-hour curve for each month' },
  { id: 'monthly', label: 'Monthly statistics', kind: '2d', hint: 'Means with percentile whiskers' },
  { id: 'histogram', label: 'Distribution', kind: '2d', hint: 'How often each value occurs' },
  { id: 'psychrometric', label: 'Psychrometric chart', kind: '2d', hint: 'Comfort and passive strategies' },
  { id: 'windrose', label: 'Wind rose', kind: '2d', hint: 'Frequency by direction and speed' },
  { id: 'sunpath', label: 'Sun path (2D)', kind: '2d', hint: 'Stereographic and orthographic projections' },
  { id: 'sundome', label: 'Sun path dome', kind: '3d', hint: 'The sky hemisphere, orbitable' },
  { id: 'surface', label: 'Annual surface', kind: '3d', hint: 'The heatmap extruded into relief' },
  { id: 'windrose3d', label: 'Wind rose (3D)', kind: '3d', hint: 'Direction, speed and frequency at once' },
  { id: 'massing', label: 'Massing & shadows', kind: '3d', hint: 'A block casting the real sun shadow' },
];

const VIEW_BY_ID = Object.fromEntries(VIEWS.map((v) => [v.id, v]));

const MODES = [
  {
    id: 'thermal',
    label: 'Thermal',
    blurb: 'Temperature through the year, and how much heating or cooling it implies.',
    variable: 'dryBulb',
    views: ['heatmap', 'timeseries', 'diurnal', 'monthly', 'histogram', 'surface'],
    variables: ['dryBulb', 'dewPoint', 'wetBulb', 'relHumidity'],
    controls: ['variable', 'period', 'degreeDayBase', 'aggregation'],
  },
  {
    id: 'solar',
    label: 'Solar',
    blurb: 'Where the sun is, how much energy it delivers, and what it shades.',
    variable: 'globalHorizontal',
    views: ['sundome', 'sunpath', 'massing', 'heatmap', 'surface', 'monthly'],
    variables: ['globalHorizontal', 'directNormal', 'diffuseHorizontal', 'solarAltitude'],
    controls: ['variable', 'period', 'cursor', 'massing'],
  },
  {
    id: 'wind',
    label: 'Wind',
    blurb: 'Prevailing directions and speeds — the starting point for site massing.',
    variable: 'windSpeed',
    views: ['windrose', 'windrose3d', 'heatmap', 'timeseries', 'monthly', 'histogram'],
    variables: ['windSpeed', 'windDirection'],
    controls: ['period', 'sectors', 'speedBands'],
  },
  {
    id: 'daylight',
    label: 'Daylight',
    blurb: 'Available daylight and sky conditions through the year.',
    variable: 'globalHorizontalIllum',
    views: ['heatmap', 'diurnal', 'monthly', 'sunpath', 'surface', 'timeseries'],
    variables: ['globalHorizontalIllum', 'diffuseHorizontalIllum', 'directNormalIllum', 'totalSkyCover'],
    controls: ['variable', 'period', 'aggregation'],
  },
  {
    id: 'comfort',
    label: 'Comfort',
    blurb: 'Which hours are comfortable, and which passive strategy could fix the rest.',
    variable: 'dryBulb',
    views: ['psychrometric', 'heatmap', 'histogram', 'monthly', 'diurnal'],
    variables: ['dryBulb', 'relHumidity', 'humidityRatio', 'enthalpy'],
    controls: ['period', 'comfortBand', 'strategies', 'adaptive'],
  },
];

const MODE_BY_ID = Object.fromEntries(MODES.map((m) => [m.id, m]));

/** Views available in a mode, in the mode's own order. */
function viewsForMode(modeId) {
  const mode = MODE_BY_ID[modeId] || MODES[0];
  return mode.views.map((id) => VIEW_BY_ID[id]).filter(Boolean);
}

/** True when a control is relevant to the active mode (used to de-emphasise, not hide). */
function controlInMode(modeId, control) {
  const mode = MODE_BY_ID[modeId];
  return !mode || mode.controls.includes(control);
}



Object.assign(__exports, {VIEWS, VIEW_BY_ID, MODES, MODE_BY_ID, viewsForMode, controlInMode});

__def("ui/stage", function (__exports, __req) {
/**
 * The presentation space: whichever view is active, plus its tooltip.
 *
 * Owns one 2D canvas and one 3D scene and swaps between them, so switching views
 * never tears down the WebGL context (which is slow and, on some drivers, leaks).
 */
const { el, clear } = __req("ui/dom");
const { fitCanvas, readTheme } = __req("render/canvas2d");
const { createScene } = __req("views3d/scene");
const { VIEW_BY_ID } = __req("ui/modes");
const { formatValue, ALL_BY_KEY } = __req("epw/fields");
const { MONTH_ABBR } = __req("epw/parse");

/** The variables shown in a hover tooltip, in reading order. */
const TOOLTIP_KEYS = ['dryBulb', 'relHumidity', 'globalHorizontal', 'directNormal', 'windSpeed', 'windDirection'];

function createStage(container, root, views2d, views3d, onProbe) {
  const canvas = el('canvas.canvas2d', { 'aria-label': 'Chart' });
  const glHost = el('div.gl-host');
  const tooltip = el('div.tooltip', { role: 'status', 'aria-live': 'polite' });
  const caption = el('div.stage-caption');
  const surface = el('div.stage-surface', {}, canvas, glHost, tooltip, caption);
  container.appendChild(surface);

  let scene = null;
  let sceneFailed = false;
  let current = null;   // { id, kind }
  let lastContext = null;
  let lastFrame = null;
  let pointer = null;

  function ensureScene() {
    if (scene || sceneFailed) return scene;
    scene = createScene(glHost, root);
    if (!scene) sceneFailed = true;
    return scene;
  }

  function setActive(viewId) {
    const meta = VIEW_BY_ID[viewId];
    const kind = meta ? meta.kind : '2d';
    current = { id: viewId, kind };
    const is3d = kind === '3d';
    canvas.style.display = is3d ? 'none' : 'block';
    glHost.style.display = is3d ? 'block' : 'none';
    if (is3d) ensureScene();
    hideTooltip();
  }

  function render(context) {
    lastContext = context;
    if (!current) return;
    if (current.kind === '3d') {
      const s = ensureScene();
      if (!s) return;
      const builder = views3d[current.id];
      if (!builder || !context) return;
      const theme = readTheme(root);
      const desc = builder.build({ ...context, uint32: s.renderer.uint32Indices }, theme);
      s.setScene(desc);
      s.resize();
      caption.textContent = desc.caption || '';
      caption.style.display = desc.caption ? 'block' : 'none';
    } else {
      fitCanvas(canvas);
      const view = views2d[current.id];
      if (!view) return;
      lastFrame = view.draw(canvas, context || { root, data: null, state: {} });
      caption.style.display = 'none';
      if (pointer) showTooltipAt(pointer.x, pointer.y);
    }
  }

  function resize() {
    if (current?.kind === '3d') scene?.resize();
    else render(lastContext);
  }

  // ── tooltip ───────────────────────────────────────────────────────────────
  function hideTooltip() {
    tooltip.classList.remove('is-visible');
    pointer = null;
  }

  function showTooltipAt(x, y) {
    if (!lastContext || !lastFrame || current?.kind === '3d') return;
    const view = views2d[current.id];
    if (!view?.probe) return hideTooltip();
    const hit = view.probe(lastFrame, lastContext, x, y);
    if (!hit) return hideTooltip();

    const rows = [];
    if (hit.rows) {
      for (const r of hit.rows) {
        rows.push([r.label, r.text != null ? r.text
          : formatValue(lastContext.field, r.value, lastContext.state.units)]);
      }
    } else if (hit.record != null && hit.record >= 0) {
      const d = lastContext.data;
      const keys = [lastContext.field.key, ...TOOLTIP_KEYS.filter((k) => k !== lastContext.field.key)];
      for (const key of keys) {
        const f = ALL_BY_KEY[key];
        const series = d.series[key];
        if (!f || !series) continue;
        const v = series[hit.record];
        if (!Number.isFinite(v)) continue;
        rows.push([f.short, formatValue(f, v, lastContext.state.units)]);
        if (rows.length >= 6) break;
      }
    }

    clear(tooltip);
    tooltip.appendChild(el('div.tooltip-title', { text: hit.title }));
    const grid = el('div.tooltip-grid');
    for (const [label, value] of rows) {
      grid.appendChild(el('span.tooltip-key', { text: label }));
      grid.appendChild(el('span.tooltip-val', { text: value }));
    }
    tooltip.appendChild(grid);
    tooltip.classList.add('is-visible');

    // Keep the tooltip inside the stage.
    const box = surface.getBoundingClientRect();
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    let tx = (hit.x != null ? hit.x : x) + 14;
    let ty = (hit.y != null ? hit.y : y) + 14;
    if (tx + tw > box.width - 8) tx = Math.max(8, (hit.x != null ? hit.x : x) - tw - 14);
    if (ty + th > box.height - 8) ty = Math.max(8, (hit.y != null ? hit.y : y) - th - 14);
    tooltip.style.transform = `translate(${Math.round(tx)}px, ${Math.round(ty)}px)`;
    return hit;
  }

  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    showTooltipAt(pointer.x, pointer.y);
  });
  canvas.addEventListener('pointerleave', hideTooltip);
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const hit = showTooltipAt(e.clientX - rect.left, e.clientY - rect.top);
    // Clicking a cell moves the shared cursor, so the sun path and massing views
    // jump to the hour the student just pointed at.
    if (hit && onProbe && lastContext?.data) {
      const d = lastContext.data;
      if (hit.day != null) {
        const key = d.dayKeys[hit.day];
        onProbe({ month: key.month, day: key.day, ...(hit.hour != null ? { hour: hit.hour } : {}) });
      }
    }
  });

  return {
    surface,
    canvas,
    glHost,
    setActive,
    render,
    resize,
    hideTooltip,
    get scene() { return scene; },
    get is3d() { return current?.kind === '3d'; },
    get activeId() { return current?.id; },
    dispose() { scene?.dispose(); },
  };
}



Object.assign(__exports, {createStage, MONTH_ABBR});
});

__def("ui/summary", function (__exports, __req) {
/**
 * The readout strip: the handful of numbers a student should be able to quote
 * about a climate after looking at it for thirty seconds.
 *
 * These are hero numbers, not a chart — they get large type and no decoration.
 */
const { el, clear } = __req("ui/dom");
const { summarise, degreeDays, windRose, countHours, percentiles } = __req("core/stats");
const { maskCount } = __req("core/filter");
const { formatValue, FIELD_BY_KEY, ALL_BY_KEY, convert, unitFor } = __req("epw/fields");
const { comfortPolygons, pointInPolygon, STANDARD_PRESSURE } = __req("core/psychro");

function tile(label, value, note) {
  return el('div.tile', {},
    el('div.tile-label', { text: label }),
    el('div.tile-value', { text: value }),
    note ? el('div.tile-note', { text: note }) : null);
}

/** Share of selected hours that fall inside either ASHRAE 55 comfort zone. */
function comfortShare(data, mask, stats) {
  const p = data.pressureFallback || STANDARD_PRESSURE;
  const polys = comfortPolygons(p, { humidityLimit: stats.humidityLimit, strategies: false });
  const t = data.series.dryBulb;
  const w = data.series.humidityRatio;
  let hits = 0;
  let total = 0;
  for (let i = 0; i < data.n; i += 1) {
    if (mask && !mask[i]) continue;
    if (!Number.isFinite(t[i]) || !Number.isFinite(w[i])) continue;
    total += 1;
    const wi = w[i] / 1000;
    if (polys.some((poly) => pointInPolygon(t[i], wi, poly.points))) hits += 1;
  }
  return total ? hits / total : NaN;
}

function render(node, context) {
  clear(node);
  if (!context) return;
  const { data, field, values, mask, state } = context;
  const u = state.units;
  const s = summarise(values, mask);
  const hours = maskCount(mask);
  if (!s.count) {
    node.appendChild(el('div.tile-empty', { text: 'No data in the selected period.' }));
    return;
  }

  const pcts = percentiles(values, mask, [state.stats.percentile]);
  const tiles = [
    tile(`Mean ${field.short.toLowerCase()}`, formatValue(field, s.mean, u)),
    // Unit lives in the label so the two numbers never wrap apart from it.
    tile(`Range (${unitFor(field, u)})`,
      `${formatValue(field, s.min, u, { bare: true })} – ${formatValue(field, s.max, u, { bare: true })}`,
      `spread ${formatValue(field, s.range, u, { delta: true })}`),
    tile(`p${state.stats.percentile}`, formatValue(field, pcts[state.stats.percentile], u)),
  ];

  // Degree days: the number that turns a temperature record into a design brief.
  if (data.series.dryBulb) {
    const base = state.stats.degreeDayBase;
    const dd = degreeDays(data, data.series.dryBulb, base, mask);
    const tf = FIELD_BY_KEY.dryBulb;
    const baseLabel = `base ${convert(tf, base, u).toFixed(0)}${unitFor(tf, u)}`;
    tiles.push(tile('Heating degree days', Math.round(dd.hdd).toLocaleString(), baseLabel));
    tiles.push(tile('Cooling degree days', Math.round(dd.cdd).toLocaleString(), baseLabel));
  }

  if (data.series.globalHorizontal) {
    const ghi = summarise(data.series.globalHorizontal, mask);
    tiles.push(tile('Global horizontal', `${Math.round(ghi.sum / 1000).toLocaleString()} kWh/m²`,
      'total over the period'));
  }

  if (data.series.windSpeed) {
    const rose = windRose(data, mask);
    const wf = FIELD_BY_KEY.windSpeed;
    const ws = summarise(data.series.windSpeed, mask);
    tiles.push(tile('Prevailing wind', rose.prevailingLabel,
      `mean ${formatValue(wf, ws.mean, u)} · calm ${(rose.calmFraction * 100).toFixed(0)}%`));
  }

  if (data.series.humidityRatio) {
    const share = comfortShare(data, mask, state.stats);
    if (Number.isFinite(share)) {
      tiles.push(tile('Comfortable hours', `${(share * 100).toFixed(1)}%`,
        `${Math.round(share * hours).toLocaleString()} of ${hours.toLocaleString()} h`));
    }
  }

  if (field.key === 'dryBulb') {
    const lowField = ALL_BY_KEY.dryBulb;
    const below = countHours(values, mask, (v) => v < state.stats.comfortLow);
    const above = countHours(values, mask, (v) => v > state.stats.comfortHigh);
    tiles.push(tile('Outside comfort band',
      `${((below.fraction + above.fraction) * 100).toFixed(0)}%`,
      `${(below.fraction * 100).toFixed(0)}% below ${formatValue(lowField, state.stats.comfortLow, u)}, `
      + `${(above.fraction * 100).toFixed(0)}% above ${formatValue(lowField, state.stats.comfortHigh, u)}`));
  }

  for (const t of tiles) node.appendChild(t);
}



Object.assign(__exports, {render, comfortShare});
});

__def("ui/toolbar", function (__exports, __req) {
/**
 * The toolbar.
 *
 * Built once, then updated in place from state. Controls are grouped by the
 * question they answer — where, when, what, how — rather than by which module
 * implements them, because that is the order a student works in.
 */
const { el, clear, icon, ICONS } = __req("ui/dom");
const { group, select, slider, segmented, toggle, button, dayPicker } = __req("ui/controls");
const { MODES, viewsForMode, controlInMode, VIEW_BY_ID } = __req("ui/modes");
const { ALL_BY_KEY, ALL_FIELDS, FIELD_BY_KEY, convert, unitFor } = __req("epw/fields");
const { presetPeriods, describePeriod, FULL_YEAR } = __req("core/filter");
const { daysInMonth, dayOfYear, sunTimes } = __req("core/solar");
const { locationLabel, coordLabel, MONTH_ABBR } = __req("epw/parse");

const HOUR_FMT = (h) => `${String(Math.round(h)).padStart(2, '0')}:00`;

function createToolbar(store, actions) {
  const controls = {};
  const sections = {};
  const node = el('div.toolbar', { role: 'region', 'aria-label': 'Controls' });

  const state = () => store.state;
  const set = (patch, opts) => store.set(patch, opts);

  // ── file ──────────────────────────────────────────────────────────────────
  const fileInput = el('input', {
    type: 'file', accept: '.epw,text/plain', style: { display: 'none' }, 'aria-hidden': 'true',
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files?.[0]) actions.loadFile(fileInput.files[0]);
    fileInput.value = '';
  });
  const importBtn = button('Import EPW', () => fileInput.click(), { icon: ICONS.upload, variant: 'primary' });

  const compareInput = el('input', {
    type: 'file', accept: '.epw,text/plain', style: { display: 'none' }, 'aria-hidden': 'true',
  });
  compareInput.addEventListener('change', () => {
    if (compareInput.files?.[0]) actions.loadFile(compareInput.files[0], true);
    compareInput.value = '';
  });

  const locationBox = el('div.location');
  sections.file = group('Weather file', importBtn.node, fileInput, compareInput, locationBox);

  // ── analysis mode ─────────────────────────────────────────────────────────
  controls.mode = segmented(
    MODES.map((m) => ({ value: m.id, label: m.label, title: m.blurb })),
    state().mode,
    (v) => actions.setMode(v),
    { label: 'Analysis mode', showLabel: false },
  );
  const modeBlurb = el('div.mode-blurb');
  sections.mode = group('Analysis mode', controls.mode.node, modeBlurb);

  // ── views ─────────────────────────────────────────────────────────────────
  const viewShelf = el('div.view-shelf', { role: 'tablist', 'aria-label': 'Views' });
  sections.views = group('View', viewShelf);

  // ── variable ──────────────────────────────────────────────────────────────
  controls.variable = select([], state().variable, (v) => set({ variable: v }), { label: 'Variable' });
  const variableAbout = el('div.hint');
  sections.variable = group('Variable', controls.variable.node, variableAbout);

  // ── analysis period ───────────────────────────────────────────────────────
  controls.preset = select([], 'year', (v) => actions.applyPreset(v), { label: 'Preset' });
  controls.from = dayPicker('From', { month: 1, day: 1 }, (v) => {
    set({ period: { fromMonth: v.month, fromDay: v.day } });
  }, (m) => daysInMonth(m, state().data?.isLeap));
  controls.to = dayPicker('To', { month: 12, day: 31 }, (v) => {
    set({ period: { toMonth: v.month, toDay: v.day } });
  }, (m) => daysInMonth(m, state().data?.isLeap));
  controls.fromHour = slider({
    label: 'From hour', min: 0, max: 23, value: 0, format: HOUR_FMT,
    onInput: (v) => set({ period: { fromHour: v } }),
  });
  controls.toHour = slider({
    label: 'To hour', min: 0, max: 23, value: 23, format: HOUR_FMT,
    onInput: (v) => set({ period: { toHour: v } }),
  });
  const periodSummary = el('div.hint');
  sections.period = group('Analysis period',
    controls.preset.node,
    el('div.row', {}, controls.from.node, controls.to.node),
    controls.fromHour.node,
    controls.toHour.node,
    periodSummary);

  // ── instant (date + time cursor) ──────────────────────────────────────────
  controls.cursorDate = dayPicker('Date', { month: 6, day: 21 }, (v) => {
    set({ cursor: { month: v.month, day: v.day } });
  }, (m) => daysInMonth(m, state().data?.isLeap));
  controls.cursorHour = slider({
    label: 'Time', min: 0, max: 23, value: 12, format: HOUR_FMT,
    onInput: (v) => set({ cursor: { hour: v } }),
  });
  controls.play = button('Play', () => actions.togglePlay(), { icon: ICONS.play, iconOnly: true, ariaLabel: 'Animate the hour' });
  controls.solstice = el('div.chips', {},
    ...[[21, 6, '21 Jun'], [21, 3, '21 Mar'], [21, 12, '21 Dec']].map(([day, month, label]) => el('button.chip', {
      type: 'button',
      onclick: () => set({ cursor: { month, day } }),
    }, label)));
  const sunReadout = el('div.hint');
  sections.cursor = group('Date & time',
    controls.cursorDate.node,
    el('div.row.row-tight', {}, controls.cursorHour.node, controls.play.node),
    controls.solstice,
    sunReadout);

  // ── statistical options ───────────────────────────────────────────────────
  controls.aggregation = segmented([
    { value: 'mean', label: 'Mean' },
    { value: 'min', label: 'Min' },
    { value: 'max', label: 'Max' },
    { value: 'sum', label: 'Total' },
  ], state().stats.aggregation, (v) => set({ stats: { aggregation: v } }), { label: 'Aggregation' });

  controls.percentile = slider({
    label: 'Percentile', min: 1, max: 99, value: 50, format: (v) => `p${v}`,
    onInput: (v) => set({ stats: { percentile: v } }),
  });
  controls.ddBase = slider({
    label: 'Degree-day base', min: 5, max: 30, step: 0.5, value: 18,
    format: (v) => `${convert(FIELD_BY_KEY.dryBulb, v, state().units).toFixed(1)} ${unitFor(FIELD_BY_KEY.dryBulb, state().units)}`,
    onInput: (v) => set({ stats: { degreeDayBase: v } }),
  });
  controls.bins = slider({
    label: 'Histogram bins', min: 6, max: 80, value: 30,
    onInput: (v) => set({ stats: { bins: v } }),
  });
  controls.comfortLow = slider({
    label: 'Comfort lower', min: 10, max: 28, step: 0.5, value: 20,
    format: (v) => `${convert(FIELD_BY_KEY.dryBulb, v, state().units).toFixed(1)}`,
    onInput: (v) => set({ stats: { comfortLow: v } }),
  });
  controls.comfortHigh = slider({
    label: 'Comfort upper', min: 18, max: 36, step: 0.5, value: 26,
    format: (v) => `${convert(FIELD_BY_KEY.dryBulb, v, state().units).toFixed(1)}`,
    onInput: (v) => set({ stats: { comfortHigh: v } }),
  });
  controls.strategies = toggle('Passive strategies', true, (v) => set({ stats: { showStrategies: v } }),
    { title: 'Show the Givoni polygons for ventilation, evaporative cooling and internal gains' });
  controls.sectors = segmented([
    { value: 8, label: '8' }, { value: 12, label: '12' }, { value: 16, label: '16' }, { value: 36, label: '36' },
  ], 16, (v) => set({ stats: { sectors: Number(v) } }), { label: 'Wind sectors' });
  controls.sunHours = toggle('Sunrise / sunset overlay', true, (v) => set({ showSunHours: v }));

  sections.stats = group('Statistics',
    controls.aggregation.node,
    controls.percentile.node,
    controls.ddBase.node,
    controls.bins.node,
    controls.comfortLow.node,
    controls.comfortHigh.node,
    controls.strategies.node,
    controls.sectors.node,
    controls.sunHours.node);

  // ── massing ───────────────────────────────────────────────────────────────
  const metres = (v) => `${v} m`;
  controls.mWidth = slider({ label: 'Width', min: 4, max: 80, value: 18, format: metres, onInput: (v) => set({ massing: { width: v } }) });
  controls.mDepth = slider({ label: 'Depth', min: 4, max: 80, value: 12, format: metres, onInput: (v) => set({ massing: { depth: v } }) });
  controls.mHeight = slider({ label: 'Height', min: 3, max: 120, value: 14, format: metres, onInput: (v) => set({ massing: { height: v } }) });
  controls.mRotation = slider({ label: 'Rotation', min: -90, max: 90, value: 0, format: (v) => `${v}°`, onInput: (v) => set({ massing: { rotation: v } }) });
  controls.mCourtyard = toggle('Perimeter block', false, (v) => set({ massing: { courtyard: v } }),
    { title: 'Open the block into a courtyard to study self-shading' });
  controls.mTrace = toggle('Hourly shadow trace', true, (v) => set({ massing: { showTrace: v } }));
  sections.massing = group('Massing',
    controls.mWidth.node, controls.mDepth.node, controls.mHeight.node, controls.mRotation.node,
    controls.mCourtyard.node, controls.mTrace.node);

  // ── sun path options ──────────────────────────────────────────────────────
  controls.projection = segmented([
    { value: 'stereo', label: 'Stereographic' },
    { value: 'ortho', label: 'Orthographic' },
  ], 'stereo', (v) => set({ sunpathProjection: v }), { label: 'Projection' });
  controls.tint = select([
    { value: '', label: 'None' },
    { value: 'globalHorizontal', label: 'Global horizontal radiation' },
    { value: 'directNormal', label: 'Direct normal radiation' },
    { value: 'dryBulb', label: 'Dry bulb temperature' },
    { value: 'totalSkyCover', label: 'Total sky cover' },
  ], '', (v) => set({ sunpathTint: v || null }), { label: 'Colour sun positions by' });
  sections.sunpath = group('Sun path', controls.projection.node, controls.tint.node);

  // ── presentation ──────────────────────────────────────────────────────────
  controls.theme = segmented([
    { value: 'dark', icon: ICONS.moon, title: 'Dark — for projection' },
    { value: 'light', icon: ICONS.sun, title: 'Light — for screens' },
    { value: 'print', icon: ICONS.printer, title: 'High contrast — for print and PDF' },
  ], state().theme, (v) => set({ theme: v }), { label: 'Theme' });
  controls.units = segmented([
    { value: 'si', label: 'SI' }, { value: 'ip', label: 'IP' },
  ], state().units, (v) => set({ units: v }), { label: 'Units' });
  controls.presentation = toggle('Presentation mode', false, (v) => actions.setPresentation(v),
    { title: 'Fullscreen, larger type, toolbar collapsed' });
  controls.compare = toggle('Compare', false, (v) => set({ compare: v }));
  controls.compareSource = segmented([
    { value: 'period', label: 'Two periods' },
    { value: 'file', label: 'Two files' },
  ], 'period', (v) => actions.setCompareSource(v), { label: 'Compare' });
  const compareLoad = button('Load second EPW', () => compareInput.click(), { icon: ICONS.upload });
  controls.compareFrom = dayPicker('From', { month: 6, day: 1 }, (v) => {
    set({ comparePeriod: { fromMonth: v.month, fromDay: v.day } });
  }, (m) => daysInMonth(m, state().data?.isLeap));
  controls.compareTo = dayPicker('To', { month: 8, day: 31 }, (v) => {
    set({ comparePeriod: { toMonth: v.month, toDay: v.day } });
  }, (m) => daysInMonth(m, state().data?.isLeap));
  const compareBody = el('div.compare-body', {},
    controls.compareSource.node, compareLoad.node,
    el('div.row', {}, controls.compareFrom.node, controls.compareTo.node));

  sections.presentation = group('Presentation',
    el('div.row', {}, controls.theme.node, controls.units.node),
    controls.presentation.node,
    controls.compare.node,
    compareBody);

  // ── export ────────────────────────────────────────────────────────────────
  sections.export = group('Export',
    el('div.row.row-tight', {},
      button('PNG', () => actions.exportPng(), { icon: ICONS.download }).node,
      button('CSV', () => actions.exportCsv(), { icon: ICONS.download }).node,
      button('Reset', () => actions.reset(), { icon: ICONS.reset }).node));

  node.append(
    sections.file, sections.mode, sections.views, sections.variable, sections.period,
    sections.cursor, sections.sunpath, sections.massing, sections.stats,
    sections.presentation, sections.export,
  );

  // ── updating ──────────────────────────────────────────────────────────────
  let lastFileKey = '';
  let lastMode = '';
  let lastView = '';

  function update() {
    const s = state();
    const data = s.data;
    const mode = MODES.find((m) => m.id === s.mode) || MODES[0];

    importBtn.setLabel(data ? 'Replace EPW' : 'Import EPW');
    modeBlurb.textContent = mode.blurb;
    controls.mode.set(s.mode);

    // Location readout.
    const fileKey = `${s.fileName}|${data?.location?.city || ''}|${s.units}`;
    if (fileKey !== lastFileKey) {
      lastFileKey = fileKey;
      clear(locationBox);
      if (data) {
        const l = data.location;
        locationBox.append(
          el('div.location-name', { text: locationLabel(l) }),
          el('dl.meta', {},
            el('dt', { text: 'Coordinates' }), el('dd', { text: coordLabel(l) }),
            el('dt', { text: 'Elevation' }), el('dd', { text: `${Math.round(l.elevation)} m` }),
            el('dt', { text: 'Time zone' }), el('dd', { text: `UTC${l.timezone >= 0 ? '+' : ''}${l.timezone}` }),

            ...(l.source ? [el('dt', { text: 'Source' }), el('dd', { text: l.source })] : []),
            el('dt', { text: 'Records' }), el('dd', { text: `${data.n.toLocaleString()} h` })),

    const available = data ? data.availableKeys : ALL_FIELDS.map((f) => f.key);
    const modeKeys = mode.variables.filter((k) => available.includes(k));
    const rest = available.filter((k) => !modeKeys.includes(k));
    controls.variable.setOptions([
      { group: `${mode.label} variables`, options: modeKeys.map((k) => ({ value: k, label: ALL_BY_KEY[k].label })) },
      { group: 'All variables in this file', options: rest.map((k) => ({ value: k, label: ALL_BY_KEY[k].label })) },
    ], s.variable);
    variableAbout.textContent = ALL_BY_KEY[s.variable]?.about || '';

      presetPeriods(data).map((p) => ({ value: p.key, label: p.fromFile ? `${p.label} (from file)` : p.label })),

    );
    controls.from.set({ month: s.period.fromMonth, day: s.period.fromDay });
    controls.to.set({ month: s.period.toMonth, day: s.period.toDay });
    controls.fromHour.set(s.period.fromHour);
    controls.toHour.set(s.period.toHour);
    periodSummary.textContent = describePeriod(s.period, data?.isLeap);

            .replace(':00', ':') + ` · sunset ${Math.floor(t.sunset)}:${String(Math.round((t.sunset % 1) * 60)).padStart(2, '0')}`

    controls.percentile.set(s.stats.percentile);
    controls.ddBase.set(s.stats.degreeDayBase);
    controls.bins.set(s.stats.bins);
    controls.comfortLow.set(s.stats.comfortLow);
    controls.comfortHigh.set(s.stats.comfortHigh);
    controls.strategies.set(s.stats.showStrategies);
    controls.sectors.set(s.stats.sectors || 16);
    controls.sunHours.set(s.showSunHours !== false);

    // Massing.
    controls.mWidth.set(s.massing.width);
    controls.mDepth.set(s.massing.depth);
    controls.mHeight.set(s.massing.height);
    controls.mRotation.set(s.massing.rotation);
    controls.mCourtyard.set(s.massing.courtyard);
    controls.mTrace.set(s.massing.showTrace !== false);

    controls.tint.set(s.sunpathTint || '');

    // Presentation.
    controls.theme.set(s.theme);
    controls.units.set(s.units);
    controls.presentation.set(s.presentation);
    controls.compare.set(s.compare);
    controls.compareSource.set(s.compareSource);
    controls.compareFrom.set({ month: s.comparePeriod.fromMonth, day: s.comparePeriod.fromDay });
    controls.compareTo.set({ month: s.comparePeriod.toMonth, day: s.comparePeriod.toDay });

    sections.sunpath.style.display = (s.view === 'sunpath' || s.view === 'sundome') ? '' : 'none';
    controls.bins.node.style.display = s.view === 'histogram' ? '' : 'none';

__def("ui/viewctx", function (__exports, __req) {
/**
 * Builds the context object every view draws from.
 *
 * Centralising this is what keeps the 2D charts, the 3D scenes and the summary
 * panel showing the same numbers: they all derive their scale, mask and colour
 * ramp here rather than each computing its own.
 */
const { ALL_BY_KEY } = __req("epw/fields");
const { buildMask, describePeriod, normalisePeriod } = __req("core/filter");
const { rampFor, makeScale, midpointFor } = __req("render/colormaps");
const { summarise } = __req("core/stats");
const { locationLabel } = __req("epw/parse");

/**
 * @param {object} state app state
 * @param {object} opts  { compare: boolean, root: HTMLElement, theme: object }
 */
function buildViewContext(state, opts = {}) {
  const data = opts.compare && state.compareSource === 'file' && state.compareData
    ? state.compareData
    : state.data;
  if (!data) return null;

  const period = opts.compare && state.compareSource === 'period'
    ? state.comparePeriod
    : state.period;

  const key = state.variable;
  const field = ALL_BY_KEY[key] || ALL_BY_KEY.dryBulb;
  const values = data.series[field.key] || data.series.dryBulb;
  const mask = buildMask(data, period);
  const p = normalisePeriod(period, data.isLeap);
  const maskKey = `${p.fromMonth}-${p.fromDay}-${p.toMonth}-${p.toDay}-${p.fromHour}-${p.toHour}`;

  const ramp = rampFor(field, state.theme);

  // Scales use the WHOLE year, not just the selection, so that changing the
  // period never silently re-colours the data and invalidates a comparison.
  const full = summarise(values, null);
  const min = Number.isFinite(field.min) && field.min > full.min ? field.min : full.min;
  const max = Number.isFinite(field.max) && field.max < full.max ? field.max : full.max;
  const mid = midpointFor(field);
  const scale = makeScale(ramp, min, max, mid);

  return {
    data,
    field,
    values,
    // Mode-derived overlays: degree days belong to a thermal reading of the year,
    // the comfort band to a comfort one.
    showDegreeDays: state.mode === 'thermal',
    showComfortBand: state.mode === 'comfort' || state.mode === 'thermal',
    mask,
    maskKey,
    ramp,
    scale,
    scale01: scale,
    min,
    max,
    stats: summarise(values, mask),
    state,
    theme: state.theme,
    root: opts.root,
    uint32: opts.uint32 !== false,
    subtitle: `${locationLabel(data.location)} · ${describePeriod(period, data.isLeap)}`,
    period,
  };
}



Object.assign(__exports, {buildViewContext});
});

__def("views2d/diurnal", function (__exports, __req) {
/**
 * Average 24-hour profile for each month.
 *
 * Months are an ordered, wrapping sequence rather than twelve unrelated
 * categories, so they are coloured with a cyclic ramp — hue carries the month,
 * and January sits next to December in colour as it does in the calendar.
 */
const { beginFrame, scaleLinear, niceDomain, drawValueAxis, drawBottomAxis, drawPlotFrame, drawTitle, drawEmpty, clipPlot } = __req("render/canvas2d");
const { MONTH_ABBR } = __req("epw/parse");
const { diurnalByMonth, diurnalProfile } = __req("core/stats");
const { RAMPS } = __req("render/colormaps");
const { unitFor, convert } = __req("epw/fields");

const MARGINS = { top: 30, right: 96, bottom: 46, left: 62 };
const HIGHLIGHT = [0, 3, 6, 9]; // Jan, Apr, Jul, Oct get direct labels

function draw(canvas, view) {
  const s = beginFrame(canvas, view.root, MARGINS);
  const { ctx, plot, theme } = s;
  const { data, field, values, mask, state } = view;
  if (!data) { drawEmpty(s, 'Load an EPW file to begin'); return s; }

  const grid = diurnalByMonth(data, values, mask);
  const overall = diurnalProfile(data, values, mask);
  const u = state.units;
  const conv = (v) => convert(field, v, u);

  let lo = Infinity;
  let hi = -Infinity;
  for (const v of grid) if (Number.isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (!Number.isFinite(lo)) { drawEmpty(s, 'No data in the selected period'); return s; }

  const [d0, d1] = niceDomain(conv(lo), conv(hi), 6);
  const y = scaleLinear(d0, d1, plot.bottom, plot.y);
  const x = (h) => plot.x + (h / 23) * plot.w;

  drawValueAxis(s, y, { label: `${field.label} (${unitFor(field, u)})`, zeroLine: d0 < 0 && d1 > 0 });
  drawBottomAxis(s, [0, 3, 6, 9, 12, 15, 18, 21].map((h) => ({
    x: x(h), label: `${String(h).padStart(2, '0')}:00`,
  })), { gridlines: true, label: 'Hour of day' });

  const monthRamp = RAMPS[view.theme].cyclic;
  clipPlot(s);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  for (let m = 0; m < 12; m += 1) {
    ctx.beginPath();
    let started = false;
    for (let h = 0; h < 24; h += 1) {
      const v = grid[m * 24 + h];
      if (!Number.isFinite(v)) { started = false; continue; }
      const px = x(h);
      const py = y(conv(v));
      if (started) ctx.lineTo(px, py); else { ctx.moveTo(px, py); started = true; }
    }
    ctx.strokeStyle = monthRamp.css(m / 12);
    ctx.lineWidth = HIGHLIGHT.includes(m) ? 2.2 : 1.4;
    ctx.globalAlpha = HIGHLIGHT.includes(m) ? 1 : 0.72;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // The all-months mean, as the reference the individual months vary about.
  ctx.beginPath();
  let started = false;
  for (let h = 0; h < 24; h += 1) {
    const v = overall.mean[h];
    if (!Number.isFinite(v)) { started = false; continue; }
    if (started) ctx.lineTo(x(h), y(conv(v))); else { ctx.moveTo(x(h), y(conv(v))); started = true; }
  }
  ctx.strokeStyle = theme.ink1;
  ctx.lineWidth = 2.4;
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Direct labels at the right-hand end of the highlighted months.
  ctx.save();
  s.font(11, 600);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  const placed = [];
  for (const m of HIGHLIGHT) {
    const v = grid[m * 24 + 23];
    if (!Number.isFinite(v)) continue;
    let py = y(conv(v));
    while (placed.some((p) => Math.abs(p - py) < 13)) py += 13;
    placed.push(py);
    ctx.fillStyle = monthRamp.css(m / 12);
    ctx.fillText(MONTH_ABBR[m], plot.right + 8, py);
  }
  // A compact month ramp acts as the legend for the eight unlabelled months.
  const lx = plot.right + 46;
  const ly = plot.y + 4;
  const lh = Math.min(140, plot.h - 8);
  for (let i = 0; i < 48; i += 1) {
    ctx.fillStyle = monthRamp.css(i / 48);
    ctx.fillRect(lx, ly + (i * lh) / 48, 8, lh / 48 + 1);
  }
  ctx.strokeStyle = theme.axis;
  ctx.lineWidth = 1;
  ctx.strokeRect(lx + 0.5, ly + 0.5, 8, lh);
  s.font(10, 400);
  ctx.fillStyle = theme.ink3;
  ctx.fillText('Jan', lx + 12, ly + 5);
  ctx.fillText('Dec', lx + 12, ly + lh - 5);
  ctx.restore();

  drawPlotFrame(s);
  drawTitle(s, `${field.label} — average day by month`, view.subtitle);
  return s;
}

function probe(s, view, px, py) {
  const { plot } = s;
  if (!view.data || px < plot.x || px > plot.right) return null;
  const h = Math.round(((px - plot.x) / plot.w) * 23);
  const grid = diurnalByMonth(view.data, view.values, view.mask);
  return {
    hourOnly: h,
    title: `${String(h).padStart(2, '0')}:00 average`,
    rows: Array.from({ length: 12 }, (_, m) => ({ label: MONTH_ABBR[m], value: grid[m * 24 + h] })),
    x: plot.x + (h / 23) * plot.w,
    y: py,
  };
}



Object.assign(__exports, {draw, probe, MARGINS});
});

__def("views2d/heatmap", function (__exports, __req) {
/**
 * Annual heatmap — the "climate carpet".
 *
 * Every hour of the year as one cell: day of year across, hour of day up.
 * Seasonal structure reads vertically, diurnal structure horizontally, and the
 * two together are what makes a climate legible at a glance.
 *
 * Hours outside the analysis period are drawn faded rather than removed, so the
 * selection stays readable in the context of the whole year.
 */
const { beginFrame, drawTitle, drawColorbar, drawBottomAxis, drawPlotFrame, drawEmpty, hexRgb } = __req("render/canvas2d");
const { MONTH_ABBR } = __req("epw/parse");
const { dayOfYear, sunTimes } = __req("core/solar");
const { formatValue, unitFor } = __req("epw/fields");

const MARGINS = { top: 30, right: 88, bottom: 42, left: 52 };

/** Cache the pixel buffer between frames; only the data or theme change it. */
let cache = { key: '', canvas: null };

function buildImage(view) {
  const { data, values, mask, scale, ramp, theme } = view;
  const cols = data.nDays;
  const key = [
    data.location.city, view.field.key, view.theme, view.min, view.max, view.maskKey, cols,
  ].join('|');
  if (cache.key === key && cache.canvas) return cache.canvas;

  const off = document.createElement('canvas');
  off.width = cols;
  off.height = 24;
  const octx = off.getContext('2d');
  const img = octx.createImageData(cols, 24);
  const px = img.data;
  const [sr, sg, sb] = hexRgb(theme.surface, [20, 20, 20]);

  for (let d = 0; d < cols; d += 1) {
    for (let h = 0; h < 24; h += 1) {
      const rec = data.grid[d * 24 + h];
      // Row 0 of the image is the top of the chart, which is hour 23.
      const p = ((23 - h) * cols + d) * 4;
      if (rec < 0 || !Number.isFinite(values[rec])) {
        px[p] = sr; px[p + 1] = sg; px[p + 2] = sb; px[p + 3] = 255;
        continue;
      }
      const [r, g, b] = ramp.rgb(scale(values[rec]));
      if (mask && !mask[rec]) {
        // Fade unselected hours toward the surface instead of hiding them.
        px[p] = Math.round(r * 0.22 + sr * 0.78);
        px[p + 1] = Math.round(g * 0.22 + sg * 0.78);
        px[p + 2] = Math.round(b * 0.22 + sb * 0.78);
      } else {
        px[p] = r; px[p + 1] = g; px[p + 2] = b;
      }
      px[p + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  cache = { key, canvas: off };
  return off;
}

function draw(canvas, view) {
  const s = beginFrame(canvas, view.root, MARGINS);
  const { ctx, plot, theme } = s;
  const { data, field, state } = view;
  if (!data) { drawEmpty(s, 'Load an EPW file to begin'); return s; }

  const img = buildImage(view);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, plot.x, plot.y, plot.w, plot.h);
  ctx.imageSmoothingEnabled = true;

  // Month boundaries. On a narrow canvas only every other month is labelled,
  // because twelve abbreviations across a phone screen run together.
  const entries = [];
  const labelEvery = plot.w < 380 ? 3 : plot.w < 560 ? 2 : 1;
  for (let m = 0; m < 12; m += 1) {
    const start = dayOfYear(m + 1, 1, data.isLeap) - 1;
    const next = m === 11 ? data.nDays : dayOfYear(m + 2, 1, data.isLeap) - 1;
    const x0 = plot.x + (start / data.nDays) * plot.w;
    const x1 = plot.x + (next / data.nDays) * plot.w;
    entries.push({ x: (x0 + x1) / 2, label: m % labelEvery === 0 ? MONTH_ABBR[m] : '' });
    if (m > 0) {
      ctx.save();
      ctx.strokeStyle = theme.gridStrong;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.round(x0) + 0.5, plot.y);
      ctx.lineTo(Math.round(x0) + 0.5, plot.bottom);
      ctx.stroke();
      ctx.restore();
    }
  }
  drawBottomAxis(s, entries.filter((e) => e.label), {});

  // Hour axis.
  ctx.save();
  s.font(11);
  ctx.fillStyle = theme.ink3;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let h = 0; h <= 24; h += 6) {
    const y = plot.bottom - (h / 24) * plot.h;
    // The top of the axis is the end of hour 23, i.e. 24:00 — not a second midnight.
    ctx.fillText(`${String(h).padStart(2, '0')}:00`, plot.x - 8, y);
    ctx.strokeStyle = theme.grid;
    ctx.beginPath();
    ctx.moveTo(plot.x, Math.round(y) + 0.5);
    ctx.lineTo(plot.right, Math.round(y) + 0.5);
    ctx.stroke();
  }
  ctx.restore();

  // Sunrise/sunset curve: the single most useful overlay on a climate carpet,
  // because it separates the daylit hours from the dark ones at a glance.
  if (state.showSunHours !== false) {
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = theme.ink1;
    ctx.globalAlpha = 0.55;
    for (const which of ['sunrise', 'sunset']) {
      ctx.beginPath();
      let started = false;
      for (let d = 0; d < data.nDays; d += 1) {
        const t = sunTimes(data.location, d + 1);
        const v = t[which];
        if (v == null) { started = false; continue; }
        const x = plot.x + ((d + 0.5) / data.nDays) * plot.w;
        const y = plot.bottom - (v / 24) * plot.h;
        if (started) ctx.lineTo(x, y); else { ctx.moveTo(x, y); started = true; }
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  drawPlotFrame(s);
  drawColorbar(s, view.ramp, view.scale01, view.min, view.max, {
    x: plot.right + 14,
    label: unitFor(field, state.units),
    format: (v) => formatValue(field, v, state.units, { bare: true }),
  });
  drawTitle(s, field.label, view.subtitle);
  return s;
}

/** Which record is under the pointer, for the tooltip. */
function probe(s, view, px, py) {
  const { plot } = s;
  const { data } = view;
  if (!data || px < plot.x || px > plot.right || py < plot.y || py > plot.bottom) return null;
  const d = Math.min(data.nDays - 1, Math.floor(((px - plot.x) / plot.w) * data.nDays));
  const h = Math.min(23, Math.floor(((plot.bottom - py) / plot.h) * 24));
  const rec = data.grid[d * 24 + h];
  if (rec < 0) return null;
  const key = data.dayKeys[d];
  return {
    record: rec,
    day: d,
    hour: h,
    title: `${key.day} ${MONTH_ABBR[key.month - 1]}, ${String(h).padStart(2, '0')}:00–${String(h).padStart(2, '0')}:59`,
    x: plot.x + ((d + 0.5) / data.nDays) * plot.w,
    y: plot.bottom - ((h + 0.5) / 24) * plot.h,
  };
}

/** Discard the cached pixel buffer (called when the file or theme changes). */
function invalidate() { cache = { key: '', canvas: null }; }



Object.assign(__exports, {draw, probe, invalidate, MARGINS});
});

__def("views2d/histogram", function (__exports, __req) {
/**
 * Distribution: how often each value occurs, and the cumulative curve beneath.
 *
 * Frequency and cumulative frequency are drawn as two stacked panels sharing one
 * x axis rather than as two y scales on one plot — the two quantities differ by
 * an order of magnitude, and a second y axis would misrepresent both.
 */
const { beginFrame, scaleLinear, niceDomain, drawValueAxis, drawBottomAxis, drawPlotFrame, drawTitle, drawEmpty, roundRect, niceTicks, tickLabel } = __req("render/canvas2d");
const { histogram, percentiles } = __req("core/stats");
const { unitFor, convert, formatValue } = __req("epw/fields");

const MARGINS = { top: 30, right: 22, bottom: 46, left: 62 };
const SPLIT = 0.66; // fraction of the plot height given to the frequency panel
const GAP = 34;

function panels(plot) {
  const topH = (plot.h - GAP) * SPLIT;
  return {
    freq: { y: plot.y, h: topH, bottom: plot.y + topH },
    cum: { y: plot.y + topH + GAP, h: plot.h - topH - GAP, bottom: plot.bottom },
  };
}

function draw(canvas, view) {
  const s = beginFrame(canvas, view.root, MARGINS);
  const { ctx, plot, theme } = s;
  const { field, values, mask, state, data } = view;
  if (!data) { drawEmpty(s, 'Load an EPW file to begin'); return s; }

  const bins = Math.max(6, Math.min(80, state.stats.bins || 30));
  const h = histogram(values, mask, bins);
  if (!h.total) { drawEmpty(s, 'No data in the selected period'); return s; }

  const u = state.units;
  const conv = (v) => convert(field, v, u);
  const p = panels(plot);

  const xDomain = niceDomain(conv(h.min), conv(h.max), 7);
  const x = scaleLinear(xDomain[0], xDomain[1], plot.x, plot.right);

  const maxPct = Math.max(...h.counts) / h.total * 100;
  const yFreq = scaleLinear(0, niceDomain(0, maxPct, 4)[1], p.freq.bottom, p.freq.y);
  const yCum = scaleLinear(0, 100, p.cum.bottom, p.cum.y);

  // Frequency panel.
  ctx.save();
  s.font(11);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const t of niceTicks(0, yFreq.domain[1], 4)) {
    const py = Math.round(yFreq(t)) + 0.5;
    ctx.strokeStyle = theme.grid;
    ctx.beginPath();
    ctx.moveTo(plot.x, py);
    ctx.lineTo(plot.right, py);
    ctx.stroke();
    ctx.fillStyle = theme.ink3;
    ctx.fillText(`${tickLabel(t, [0, 1])}%`, plot.x - 8, py);
  }
  ctx.restore();

  const binW = plot.w / bins;
  for (let b = 0; b < bins; b += 1) {
    const pct = (h.counts[b] / h.total) * 100;
    if (pct <= 0) continue;
    const x0 = x(conv(h.bins[b].lo));
    const x1 = x(conv(h.bins[b].hi));
    const top = yFreq(pct);
    ctx.fillStyle = view.ramp.css(view.scale((h.bins[b].lo + h.bins[b].hi) / 2));
    // 2px gap between bars so adjacent fills never merge into one block.
    roundRect(ctx, Math.min(x0, x1) + 1, top, Math.max(1, Math.abs(x1 - x0) - 2), p.freq.bottom - top, 4);
    ctx.fill();
  }

  // Cumulative panel.
  ctx.save();
  s.font(11);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (const t of [0, 25, 50, 75, 100]) {
    const py = Math.round(yCum(t)) + 0.5;
    ctx.strokeStyle = t === 50 ? theme.gridStrong : theme.grid;
    ctx.beginPath();
    ctx.moveTo(plot.x, py);
    ctx.lineTo(plot.right, py);
    ctx.stroke();
    ctx.fillStyle = theme.ink3;
    ctx.fillText(`${t}%`, plot.x - 8, py);
  }
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(x(conv(h.bins[0].lo)), yCum(0));
  for (let b = 0; b < bins; b += 1) {
    ctx.lineTo(x(conv(h.bins[b].hi)), yCum(h.cumulative[b] * 100));
  }
  ctx.strokeStyle = theme.ink1;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // Percentile markers on the cumulative curve.
  const pcts = percentiles(values, mask, [state.stats.percentile]);
  const pv = pcts[state.stats.percentile];
  if (Number.isFinite(pv)) {
    const pxv = x(conv(pv));
    ctx.save();
    ctx.strokeStyle = theme.accent2;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(pxv, p.freq.y);
    ctx.lineTo(pxv, p.cum.bottom);
    ctx.stroke();
    ctx.setLineDash([]);
    s.font(11, 600);
    ctx.fillStyle = theme.accent2;
    ctx.textAlign = pxv > plot.x + plot.w * 0.7 ? 'right' : 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`p${state.stats.percentile} = ${formatValue(field, pv, u)}`,
      pxv + (pxv > plot.x + plot.w * 0.7 ? -6 : 6), p.freq.y + 4);
    ctx.restore();
  }

  drawBottomAxis(s, niceTicks(xDomain[0], xDomain[1], 7).map((t) => ({ x: x(t), label: tickLabel(t, niceTicks(xDomain[0], xDomain[1], 7)) })), {
    label: `${field.label} (${unitFor(field, u)})`,
  });

  ctx.save();
  ctx.strokeStyle = theme.axis;
  ctx.lineWidth = 1;
  ctx.strokeRect(Math.round(plot.x) + 0.5, Math.round(p.freq.y) + 0.5, Math.round(plot.w), Math.round(p.freq.h));
  ctx.strokeRect(Math.round(plot.x) + 0.5, Math.round(p.cum.y) + 0.5, Math.round(plot.w), Math.round(p.cum.h));
  s.font(11, 500);
  ctx.fillStyle = theme.ink2;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('Share of hours in each bin', plot.x, p.freq.y - 5);
  ctx.fillText('Cumulative share of hours below', plot.x, p.cum.y - 5);
  ctx.restore();

  drawTitle(s, `${field.label} — distribution`, view.subtitle);
  return s;
}

function probe(s, view, px, py) {
  const { plot } = s;
  if (!view.data || px < plot.x || px > plot.right) return null;
  const bins = Math.max(6, Math.min(80, view.state.stats.bins || 30));
  const h = histogram(view.values, view.mask, bins);
  if (!h.total) return null;
  const b = Math.min(bins - 1, Math.max(0, Math.floor(((px - plot.x) / plot.w) * bins)));
  const f = (v) => formatValue(view.field, v, view.state.units);
  return {
    title: `${f(h.bins[b].lo)} – ${f(h.bins[b].hi)}`,
    rows: [
      { label: 'Hours', text: String(h.counts[b]) },
      { label: 'Share', text: `${((h.counts[b] / h.total) * 100).toFixed(2)}%` },
      { label: 'Cumulative', text: `${(h.cumulative[b] * 100).toFixed(1)}%` },
    ],
    x: plot.x + (plot.w / bins) * (b + 0.5),
    y: py,
  };
}



Object.assign(__exports, {draw, probe, MARGINS});
